<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VariMitra V4 Admin</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f5f8;margin:0;color:#17202a}.head{background:white;padding:20px 28px;border-bottom:1px solid #e5e7eb}.head h1{margin:0 0 4px}.head p{margin:0;color:#667085}.wrap{max-width:1400px;margin:22px auto;padding:0 20px}.cams{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.cam,.card,.timeline{background:white;border-radius:14px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.05)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.on{background:#22c55e}.off{background:#ef4444}.muted{color:#667085;font-size:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.stat{background:#f8fafc;padding:9px;border-radius:9px}.stat b{display:block;font-size:18px}.card{margin:14px 0}.top{display:flex;justify-content:space-between}.badge{background:#fff3cd;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:bold}.images{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:14px}.panel{border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}.pt{padding:8px 10px;font-weight:bold;font-size:12px}.panel img{display:block;width:100%;height:300px;object-fit:contain;background:#111}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.mi{background:#f8fafc;padding:9px;border-radius:9px}.mi span{display:block;font-size:10px;color:#667085}.actions{margin-top:12px}button{border:0;border-radius:8px;padding:10px 14px;font-weight:bold;cursor:pointer;margin-right:7px}.yes{background:#198754;color:white}.no{background:#dc3545;color:white}.sighting{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #eee}.time{min-width:170px;color:#667085}.route{font-weight:bold}@media(max-width:800px){.images,.meta{grid-template-columns:1fr}.panel img{height:240px}}
</style></head><body><div class="head"><h1>VariMitra V4 — Temple Command Center</h1><p>Multi-camera health, candidate verification and cross-camera sighting history.</p></div><div class="wrap"><h2>Camera Network</h2><div id="cams" class="cams"></div><h2>Pending Candidate Matches</h2><div id="alerts"></div><h2>Recent Cross-Camera Sightings</h2><div id="timeline" class="timeline"></div></div><script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function loadCams(){const d=await (await fetch('/cameras')).json(),r=document.getElementById('cams');r.innerHTML='';for(const c of d){const e=document.createElement('div');e.className='cam';e.innerHTML=`<div><span class="dot ${c.online?'on':'off'}"></span><b>${esc(c.camera_id)}</b></div><div class="muted">${esc(c.camera_location)}</div><div class="stats"><div class="stat"><span class="muted">FPS</span><b>${Number(c.fps||0).toFixed(1)}</b></div><div class="stat"><span class="muted">Faces</span><b>${c.faces||0}</b></div></div><div class="muted" style="margin-top:8px">${c.online?'ONLINE':'OFFLINE'}</div>`;r.appendChild(e)}}
async function loadAlerts(){const d=await (await fetch('/alerts?status=PENDING')).json(),r=document.getElementById('alerts');r.innerHTML='';for(const a of d){const e=document.createElement('div');e.className='card';e.innerHTML=`<div class="top"><div><b style="font-size:20px">${esc(a.name)}</b><div class="muted">${esc(a.case_id)}</div></div><span class="badge">${esc(a.confidence_band)} CANDIDATE</span></div><div class="images"><div class="panel"><div class="pt">REFERENCE PHOTO</div><img src="/cases/${encodeURIComponent(a.case_id)}/reference"></div><div class="panel"><div class="pt">CCTV EVIDENCE · ${esc(a.camera_id)}</div><img src="/alerts/${a.alert_id}/evidence?t=${Date.now()}"></div></div><div class="meta"><div class="mi"><span>SIMILARITY</span>${Number(a.similarity).toFixed(3)}</div><div class="mi"><span>CAMERA</span>${esc(a.camera_id)}</div><div class="mi"><span>LOCATION</span>${esc(a.camera_location)}</div><div class="mi"><span>TRACK</span>T${a.track_id??'-'}</div></div><div class="actions"><button class="yes" onclick="review(${a.alert_id},'confirm')">Confirm Match</button><button class="no" onclick="review(${a.alert_id},'reject')">Reject</button></div>`;r.appendChild(e)}}
async function loadTimeline(){const d=await (await fetch('/sightings?limit=30')).json(),r=document.getElementById('timeline');r.innerHTML='';for(const s of d){const e=document.createElement('div');e.className='sighting';e.innerHTML=`<div class="time">${new Date(s.timestamp).toLocaleString()}</div><div><div class="route">${esc(s.name)} → ${esc(s.camera_location)}</div><div class="muted">${esc(s.camera_id)} · similarity ${Number(s.similarity).toFixed(3)} · track T${s.track_id??'-'}</div></div>`;r.appendChild(e)}}
async function review(id,a){await fetch(`/alerts/${id}/${a}`,{method:'POST'});loadAlerts()}async function refresh(){await Promise.all([loadCams(),loadAlerts(),loadTimeline()])}refresh();setInterval(refresh,2500);
</script></body></html>
