<!doctype html><html><head><meta charset="utf-8"><title>VariMitra Admin</title><style>body{font-family:Arial;background:#f3f4f6;margin:0;color:#111827}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:white;padding:20px;border-radius:16px;margin:18px 0;box-shadow:0 2px 12px #0001}.images{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid #ddd;border-radius:12px;overflow:hidden}.panel h4{margin:0;padding:10px 12px}.panel img{width:100%;height:340px;object-fit:contain;background:#111}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.meta div{background:#f8fafc;padding:10px;border-radius:9px}.meta small{display:block;color:#667085}.ok,.bad{padding:10px 15px;border:0;border-radius:8px;color:white;margin-top:15px;margin-right:8px;font-weight:bold}.ok{background:#198754}.bad{background:#dc3545}@media(max-width:800px){.images,.meta{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>VariMitra Missing Person Admin</h1><p>Reference photo vs CCTV evidence. Admin verification required.</p><div id="root"></div></div><script>async function load(){let d=await (await fetch('/alerts?status=PENDING')).json();let r=document.getElementById('root');r.innerHTML='';if(!d.length){r.innerHTML='<div class="card">No pending matches.</div>';return;}for(let a of d){let e=document.createElement('div');e.className='card';e.innerHTML=`<h2>${a.name}</h2><div class="images"><div class="panel"><h4>REFERENCE PHOTO</h4><img src="/cases/${a.case_id}/reference"></div><div class="panel"><h4>CCTV EVIDENCE</h4><img src="/alerts/${a.alert_id}/evidence?t=${Date.now()}"></div></div><div class="meta"><div><small>Similarity</small>${Number(a.similarity).toFixed(3)}</div><div><small>Camera</small>${a.camera_id}</div><div><small>Location</small>${a.camera_location}</div><div><small>Track</small>T${a.track_id}</div><div><small>Case</small>${a.case_id}</div><div><small>Time</small>${new Date(a.timestamp).toLocaleString()}</div></div><button class="ok" onclick="rev(${a.alert_id},'confirm')">Confirm Match</button><button class="bad" onclick="rev(${a.alert_id},'reject')">Reject</button>`;r.appendChild(e)}}async function rev(id,a){await fetch(`/alerts/${id}/${a}`,{method:'POST'});load()}load();setInterval(load,2500)</script></body></html>
