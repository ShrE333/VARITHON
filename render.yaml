services:
  - type: web
    name: varimitra-api
    runtime: python
    buildCommand: bash build.sh
    startCommand: uvicorn render_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: VARIMITRA_API_KEY
        generateValue: true
